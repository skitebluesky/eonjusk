<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 환경 개선 호소문 작성기</title>
    <!-- Pretendard 웹폰트 적용 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #10b981;
            --secondary-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
            --accent-glow: rgba(99, 102, 241, 0.15);
        }

        * {
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .card-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input::placeholder, textarea::placeholder {
            color: #475569;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: #334155;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
        }

        .preview-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .preview-box {
            flex: 1;
            background-color: #0b1120;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 20px;
            font-size: 0.92rem;
            line-height: 1.7;
            color: #cbd5e1;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 520px;
            font-family: 'Pretendard', sans-serif;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>학교 개선 호소문 생성기</h1>
    <p>논리적이고 정중한 표현으로 어른들과 기관을 설득하는 양식을 완성해보세요.</p>
</header>

<div class="container">
    <!-- 입력 폼 카드 -->
    <div class="card">
        <div class="card-header">
            <h2>📝 내용 작성하기</h2>
        </div>
        <form id="appealForm">
            <div class="form-group">
                <label for="recipient">수신인</label>
                <input type="text" id="recipient" placeholder="예: OO교육청 교육장님, OO학교운영위원회 위원장님">
            </div>
            <div class="form-group">
                <label for="schoolName">학교명</label>
                <input type="text" id="schoolName" placeholder="예: OO고등학교">
            </div>
            <div class="form-group">
                <label for="gradeClass">작성자 신분</label>
                <input type="text" id="gradeClass" placeholder="예: 2학년 재학생 대표 / OO고 학생 일동">
            </div>
            <div class="form-group">
                <label for="issueTitle">호소 제목</label>
                <input type="text" id="issueTitle" placeholder="예: 노후화된 교실 냉난방 시설 개선 건의">
            </div>
            <div class="form-group">
                <label for="issueDetail">구체적 현황 및 문제점</label>
                <textarea id="issueDetail" placeholder="예: 여름철 교실 온도가 30도를 넘어 학습에 큰 지장이 있습니다."></textarea>
            </div>
            <div class="form-group">
                <label for="impact">학생들이 겪는 피해/불편</label>
                <textarea id="impact" placeholder="예: 수업 집중력 저하 및 온열 질환 우려가 발생하고 있습니다."></textarea>
            </div>
            <div class="form-group">
                <label for="proposedSolution">현실적인 개선 요청 사항</label>
                <textarea id="proposedSolution" placeholder="예: 순차적인 냉난방기 점검 및 교체 예산 반영을 요청합니다."></textarea>
            </div>
            <button type="button" class="btn btn-primary" onclick="generateLetter()">호소문 생성하기</button>
        </form>
    </div>

    <!-- 미리보기 카드 -->
    <div class="card">
        <div class="card-header">
            <h2>📄 완성된 호소문 미리보기</h2>
        </div>
        <div class="preview-wrapper">
            <div id="preview" class="preview-box">왼쪽 양식을 작성한 후 [호소문 생성하기] 버튼을 눌러주세요.</div>
            <div class="btn-group">
                <button type="button" class="btn btn-secondary" onclick="copyText()">클립보드 복사</button>
                <button type="button" class="btn btn-success" onclick="downloadTxt()">.txt 파일 저장</button>
            </div>
        </div>
    </div>
</div>

<script>
    function getTodayDate() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}년 ${month}월 ${day}일`;
    }

    function generateLetter() {
        const recipient = document.getElementById('recipient').value.trim() || '[수신인]';
        const schoolName = document.getElementById('schoolName').value.trim() || '[학교명]';
        const gradeClass = document.getElementById('gradeClass').value.trim() || '[작성자 신분]';
        const issueTitle = document.getElementById('issueTitle').value.trim() || '[호소 제목]';
        const issueDetail = document.getElementById('issueDetail').value.trim() || '[문제점 내용]';
        const impact = document.getElementById('impact').value.trim() || '[피해 내용]';
        const proposedSolution = document.getElementById('proposedSolution').value.trim() || '[개선 요청 사항]';
        const todayStr = getTodayDate();

        const letter = `[호소문] ${issueTitle}

수신: ${recipient}
발신: ${schoolName} ${gradeClass}
날짜: ${todayStr}

존경하는 ${recipient},

안녕하십니까. 저는 ${schoolName}에 재학 중인 ${gradeClass}입니다. 항상 지역 교육 발전과 학생들의 건강한 학교 생활을 위해 애써주심에 진심으로 감사드립니다.

오늘 이렇게 글로써 마음을 전하게 된 것은, 현재 저희 학교에서 많은 학생들이 겪고 있는 절박한 문제에 대해 어른들의 따뜻한 관심과 실질적인 도움을 요청드리기 위함입니다.

현재 저희 학교는 ${issueDetail}라는 어려움에 처해 있습니다. 
이로 인해 학생들은 ${impact} 등 학업과 일상생활에서 큰 불편과 고통을 겪고 있는 실정입니다. 학생들이 스스로 해결하기에는 한계가 있는 구조적인 문제이기에, 교육 현장의 목소리에 귀 기울여 주시는 어른들의 개입이 절실합니다.

이에 저희 학생들은 다음과 같은 개선 방안을 감히 제안해 드리고자 합니다.

- 개선 요청 사항: ${proposedSolution}

학생들이 안전하고 쾌적한 환경에서 학업에 전념할 수 있도록, 부디 저희의 목소리를 외면하지 마시고 현장을 살피어 필요한 조치를 취해주시기를 간곡히 부탁드립니다. 작은 변화가 저희 학생들에게는 큰 희망이 될 수 있습니다.

바쁘신 와중에도 긴 글 읽어주셔서 진심으로 감사드립니다.

${todayStr}

${schoolName} ${gradeClass} 드림`;

        document.getElementById('preview').innerText = letter;
    }

    function copyText() {
        const text = document.getElementById('preview').innerText;
        if(text.includes("왼쪽 양식을 작성한 후")) {
            alert('먼저 호소문을 생성해주세요.');
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            alert('호소문이 클립보드에 복사되었습니다.');
        }).catch(err => {
            alert('복사에 실패했습니다. 직접 드래그해서 복사해주세요.');
        });
    }

    function downloadTxt() {
        const text = document.getElementById('preview').innerText;
        if(text.includes("왼쪽 양식을 작성한 후")) {
            alert('먼저 호소문을 생성해주세요.');
            return;
        }
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = '학교개선_호소문.txt';
        link.click();
    }
</script>

</body>
</html>
